services:
  mcp:
    build: .
    container_name: comfy-mcp
    ports:
      - "${PORT:-8091}:8000"
    environment:
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
      # ComfyUI 服務位址（依實際佈署之主機與埠號調整）
      COMFYUI_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      COMFY_LOCAL_URL: ${COMFYUI_URL:-http://host.docker.internal:8188}
      COMFY_MCP_REMOTE_SHARED_MODELS: "1"
      WORKFLOW_DIR: /app/workflows
      WORKFLOW_HOST_DIR: ${WORKFLOW_HOST_DIR:-./tmp}
    volumes:
      # 掛載宿主機的 ComfyUI 模型與輸出目錄，讓 download_model 直接寫入共用模型目錄
      - ${COMFYUI_MODELS_DIR:-/data/comfyui/models}:/comfy/ComfyUI/models
      - ${COMFYUI_OUTPUT_DIR:-/data/comfyui/output}:/comfy/ComfyUI/output
      - ${WORKFLOW_HOST_DIR:-./tmp}:/app/workflows
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
